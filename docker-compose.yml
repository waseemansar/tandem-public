services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: tandem
            POSTGRES_PASSWORD: tandem
            POSTGRES_DB: tandem
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
            interval: 5s
            timeout: 3s
            retries: 5

    postgres-e2e:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: tandem
            POSTGRES_PASSWORD: tandem
            POSTGRES_DB: tandem_e2e
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tandem -d tandem_e2e"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    postgres-data:
